name: Publish paperless-backup image

on:
  push:
    branches: ["main"]
    paths:
      - 'images/paperless-backup/**'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write


# alternative steps without QEMU: https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images#publishing-images-to-github-packages
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build tag
        id: calc
        run: |
          echo "image_version=$((GITHUB_RUN_NUMBER + 20))" >> $GITHUB_OUTPUT
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Create image metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/renklus/paperless-ngx-backup
          tags: |
            type=ref,event=branch
            type=sha
            type=ref,event=tag
            # unique per-run version so every workflow execution produces a new image
            type=raw,value=v${{ steps.calc.outputs.image_version }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./images/paperless-backup
          file: ./images/paperless-backup/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
