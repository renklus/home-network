# Upgraded to v3 only to export the data for the move to the prod cluster (k8s-prod/apps/paperless), whose import needs
# the same version. Export on the k8s host:
# sudo k3s kubectl -n paperless-ngx-2 exec deploy/paperless-ngx-2-webserver -- document_exporter /usr/src/backup-target/v3-migration
apiVersion: v1
kind: Namespace
metadata:
  name: paperless-ngx-2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx-2-webserver
  namespace: paperless-ngx-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-ngx-2-webserver
  template:
    metadata:
      labels:
        app: paperless-ngx-2-webserver
    spec:
      containers:
        - name: webserver
          image: ghcr.io/paperless-ngx/paperless-ngx:3.2.1@sha256:5fa76604a81df6945086e0837b14b56543d137e8ce4f311cc5d9ebe907e74e79
          ports:
            - containerPort: 8000
          env:
            - name: PAPERLESS_URL
              value: "https://paperless-ngx-2-webserver.paperless-ngx-2.k8s.renklus.ch"
            - name: PAPERLESS_REDIS
              value: "redis://paperless-ngx-2-broker.paperless-ngx-2.svc.k8s2.home.arpa:6379"
            - name: USERMAP_UID
              value: "3003"
            - name: USERMAP_GID
              value: "3003"
            - name: PAPERLESS_EMPTY_TRASH_DELAY
              value: "1800" #5 years
            #   # must exist before configuring this setting (could be helpful: https://docs.paperless-ngx.com/advanced_usage/#custom-container-initialization)
            # - name: PAPERLESS_EMPTY_TRASH_DIR
            #   value: "/usr/src/paperless/trash-empty-dir" # storage of PDFs after trash was emptied
            - name: PAPERLESS_FILENAME_FORMAT
              value: "{{ created_year }}/{{ correspondent }}/{{ created }} - {{ title }} - {{ doc_pk }}"
            #   # https://docs.paperless-ngx.com/configuration/#PAPERLESS_ENABLE_FLOWER
            - name: PAPERLESS_WORKER_TIMEOUT
              value: "7200" # default: 1800 seconds
            - name: PAPERLESS_ENABLE_FLOWER
              value: "SET"
            - name: PAPERLESS_CONSUMER_POLLING_INTERVAL
              value: "30" # seconds
            # v3 runs SQLite in WAL mode, which does not work on NFS
            - name: PAPERLESS_DB_OPTIONS
              value: "init_command=PRAGMA journal_mode=DELETE"
            # Required since v3. Created by hand on the k8s host:
            # sudo k3s kubectl -n paperless-ngx-2 create secret generic paperless-secret-key \
            #   --from-literal=secret-key="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')"
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secret-key
                  key: secret-key
            - name: PAPERLESS_OCR_LANGUAGE
              value: "deu+eng"
            - name: PAPERLESS_TIME_ZONE
              value: "Europe/Zurich"
            - name: PAPERLESS_DATE_PARSER_LANGUAGES
              value: "de-CH+en-CH"
            #   # set to birth date. Do through hashicorp for privacy
            # - name: PAPERLESS_IGNORE_DATES
            #   value: ""
          volumeMounts:
            - name: 'paperless-ngx-2-webserver'
              mountPath: /usr/src/paperless/data
              subPath: data
            - name: 'paperless-ngx-2-webserver'
              mountPath: /usr/src/paperless/media
              subPath: media
            - name: 'paperless-ngx-2-webserver-consume'
              mountPath: /usr/src/paperless/consume
            - name: 'paperless-ngx-2-webserver-backup-target'
              mountPath: /usr/src/backup-target
            - name: 'paperless-ngx-2-webserver'
              mountPath: /tmp/paperless
              subPath: tmp
          resources:
            limits:
              cpu: 400m
            requests:
              cpu: 0m
          startupProbe:
            httpGet:
              path: /
              port: 8000
            failureThreshold: 360 # 1 h: the v3 database migration and search index rebuild run before the webserver starts
            periodSeconds: 10
      volumes:
        - name: 'paperless-ngx-2-webserver'
          persistentVolumeClaim:
            claimName: 'webserver'
        - name: 'paperless-ngx-2-webserver-consume'
          persistentVolumeClaim:
            claimName: 'consume'
        - name: 'paperless-ngx-2-webserver-backup-target'
          persistentVolumeClaim:
            claimName: 'backup-target'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx-2-broker
  namespace: paperless-ngx-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-ngx-2-broker
  template:
    metadata:
      labels:
        app: paperless-ngx-2-broker
    spec:
      containers:
        - name: broker
          image: docker.io/library/redis:8.10.0@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366
          volumeMounts:
            - name: 'paperless-ngx-2-broker'
              mountPath: '/data'
              subPath: 'redisdata'
      volumes:
        - name: 'paperless-ngx-2-broker'
          persistentVolumeClaim:
            claimName: 'webserver'
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-ngx-2-broker
  namespace: paperless-ngx-2
spec:
  selector:
    app: paperless-ngx-2-broker
  ports:
    - name: paperless-ngx-2-broker
      port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-ngx-2-webserver
  namespace: paperless-ngx-2
spec:
  selector:
    app: paperless-ngx-2-webserver
  type: LoadBalancer
  ports:
    - name: paperless-ngx-2-webserver
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-ngx-2-flower
  namespace: paperless-ngx-2
spec:
  selector:
    app: paperless-ngx-2-webserver
  type: LoadBalancer
  ports:
    - name: paperless-ngx-2-flower
      port: 80
      targetPort: 5555
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: 'webserver'
  namespace: 'paperless-ngx-2'
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: 'truenas-nfs-hard-2'
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: 'consume'
  namespace: 'paperless-ngx-2'
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: 'truenas-nfs-hard-2'
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: 'backup-target'
  namespace: 'paperless-ngx-2'
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: 'truenas-nfs-hard-2'
  resources:
    requests:
      storage: 100Gi
