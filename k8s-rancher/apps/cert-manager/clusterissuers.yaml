# Issuer can only be active in it's namespace. ClusterIssuer is for all namespaces
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging-shortlived
  annotations:
    # after the chart (wave 0) is healthy, otherwise the cert-manager webhook rejects it on first sync
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    #email: email@example.com
    # Profiles
    # https://letsencrypt.org/docs/profiles/
    # https://cert-manager.io/docs/configuration/acme/#acme-certificate-profiles
    profile: shortlived
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-shortlived-key
    solvers:
    - http01:
        ingress:
          ingressClassName: traefik
---
# Issuer can only be active in it's namespace. ClusterIssuer is for all namespaces
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-shortlived
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    profile: shortlived
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-shortlived-key
    solvers:
    - http01:
        ingress:
          ingressClassName: traefik
---
# Canary: the cert-manager app is only healthy once this staging certificate is issued, i.e. the whole public HTTP-01 path
# (DNS, router, HAProxy, Traefik) works. Apps requesting production certificates use a later sync-wave, so a broken
# path during bootstrap only burns staging attempts instead of production rate limits.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: canary-certificate
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Secret names are always required.
  secretName: canary-certificate-tls
  privateKey:
    rotationPolicy: Always

  # Optional: https://cert-manager.io/docs/reference/api-docs/#cert-manager.io/v1.CertificateSpec
  # duration: 2160h # 90d
  # renewBefore: 360h # 15d

  isCA: false
  # Default when not set
  # usages:
  #   - server auth
  #   - client auth

  subject:
    organizations:
      - 'renklus ch'

  dnsNames:
    - canary-cert.rancher.k8s.renklus.ch

  # Issuer references are always required.
  issuerRef:
    name: letsencrypt-staging-shortlived
    # We can reference ClusterIssuers by changing the kind here.
    # The default value is Issuer (i.e. a locally namespaced Issuer)
    kind: ClusterIssuer
    # This is optional since cert-manager will default to this value however
    # if you are using an external issuer, change this to that issuer group.
    group: cert-manager.io