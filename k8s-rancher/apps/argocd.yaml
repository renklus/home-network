apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # name must be exactly this to override the manual installation from cluster bootstrapping
  # Alternatively explicitly set the application name in the helm parameter 'releaseName'/'nameOverride'/'fullnameOverride' or specify the name during cluster bootstrapping
  name: argo-cd
  namespace: argocd
  annotations:
    # after cert-manager (wave 1) because the server certificate needs the ClusterIssuer
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    # argocd should never be deleted, even if this app is deleted by accident.
spec:
  sources:
  - repoURL: https://argoproj.github.io/argo-helm
    chart: 'argo-cd'
    targetRevision: '9.4.2'
    helm:
      parameters:
        - name: 'server.service.type'
          value: 'LoadBalancer'
        - name: 'global.domain'
          value: 'argo.rancher.k8s.renklus.ch'
        - name: 'server.certificate.enabled'
          value: 'true'
        - name: 'server.certificate.issuer.kind'
          value: 'ClusterIssuer'
        - name: 'server.certificate.issuer.name'
          value: 'letsencrypt-staging-shortlived'
        - name: 'server.certificate.additionalHosts[0]'
          value: 'argo-cd-argocd-server.argocd.rancher.k8s.renklus.ch'
      valuesObject:
        global:
          image:
            repository: 'quay.io/argoproj/argocd'
            tag: 'v3.5.3@sha256:dd3f47d5a5e4da563a7a398506e892481b358a7cec50abdf320c71aa55904bfa' # Keep this one as it auto-shows good changenotes in renovate.
        # do not set these explicitly. The helm chart will update it when it is time. (probably not best practice but ok for now)
        # server:
        #   extensions:
        #     image:
        #       repository: 'quay.io/argoprojlabs/argocd-extension-installer'
        #       tag: 'v0.0.9'
        # dex:
        #   image:
        #     repository: 'ghcr.io/dexidp/dex'
        #     tag: 'v2.43.0'
        # redis:
        #   exporter:
        #     image:
        #       repository: 'ghcr.io/oliver006/redis_exporter'
        #       tag: 'v1.81.0'
        #   image:
        #     repository: 'public.ecr.aws/docker/library/redis'
        #     tag: '8.2.3-alpine'
        # redis-ha:
        #   # disabled because renovate cannot dela with it and it is currently unused
        #   # exporter:
        #   #   image: 'ghcr.io/oliver006/redis_exporter'
        #   #   # renovate: datasource=docker depName=ghcr.io/oliver006/redis_exporter
        #   #   tag: 'v1.73.0@sha256:1a8f5e48b2af0fb02d182be3ddd623e7e39881b6464bdb5bf843b1f6d45ed050'
        #   image:
        #     repository: 'public.ecr.aws/docker/library/redis'
        #     tag: '8.2.3-alpine'
        configs:
          cm:
            "users.session.duration": '22h'
            # Without this, child Applications count as healthy immediately and sync waves in app-of-apps don't wait for them.
            # Also add this to the values of the manual argo-cd install when bootstrapping, otherwise the first sync doesn't wait either.
            # https://argo-cd.readthedocs.io/en/stable/operator-manual/upgrading/1.7-1.8/#health-assessment-of-argoprojioapplication-crd-has-been-removed
            "resource.customizations.health.argoproj.io_Application": |
              hs = {}
              hs.status = "Progressing"
              hs.message = ""
              if obj.status ~= nil then
                if obj.status.health ~= nil then
                  hs.status = obj.status.health.status
                  if obj.status.health.message ~= nil then
                    hs.message = obj.status.health.message
                  end
                end
              end
              return hs
          params:
            "create": 'true'
            # required for https://github.com/argoproj/argo-cd/issues/11143#issuecomment-1664144190
            # see also Server-Side Diff: https://argo-cd.readthedocs.io/en/stable/user-guide/diff-strategies/
            "controller.diff.server.side": 'true'
  - path: k8s-rancher/apps/argocd
    repoURL: 'https://github.com/renklus/home-network'
    targetRevision: HEAD
  project: rancher-cluster
  destination:
    namespace: argocd
    name: in-cluster
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true