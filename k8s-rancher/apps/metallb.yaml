apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-rancher
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  sources:
  - repoURL: 'https://metallb.github.io/metallb'
    chart: 'metallb'
    targetRevision: '0.16.2'
    helm:
      parameters:
        - name: 'prometheus.serviceMonitor.enabled'
          value: 'true'
        # The chart's extra Role for Prometheus isn't needed: kube-prometheus-stack's Prometheus reads targets cluster-wide.
        - name: 'prometheus.rbacPrometheus'
          value: 'false'
      valuesObject:
        speaker:
          image:
            repository: 'quay.io/metallb/speaker'
            tag: 'v0.16.2@sha256:01666518b091a6651d68891c802db84b2219495d7e0e41c2e61c46f9976be231'
          resources:
            requests:
              cpu: '25m'
              memory: '64Mi'
            limits:
              memory: '256Mi'
          frr:
            image:
              repository: 'quay.io/frrouting/frr'
              tag: '10.7.1@sha256:e995beaa50fdc9edb35eadcfefa29b7f062cc06f2b812613789b68fa541554d2'
        controller:
          image:
            repository: 'quay.io/metallb/controller'
            tag: 'v0.16.2@sha256:34a6f107f29c4fc6e9d084a7f3bdb781aae7b5ee2b534195a2775ab68c09c503'
          resources:
            requests:
              cpu: '25m'
              memory: '64Mi'
            limits:
              memory: '256Mi'
        # the statuscleaner's update strategy is set by kyverno/metallb-statuscleaner-strategy.yaml (no chart value for it)
        frr-k8s:
          frrk8s:
            resources:
              requests:
                cpu: '25m'
                memory: '64Mi'
              limits:
                memory: '256Mi'
            frr:
              resources:
                requests:
                  cpu: '25m'
                  memory: '64Mi'
                limits:
                  memory: '256Mi'
            reloader:
              resources:
                requests:
                  cpu: '10m'
                  memory: '32Mi'
                limits:
                  memory: '128Mi'
            frrMetrics:
              resources:
                requests:
                  cpu: '10m'
                  memory: '32Mi'
                limits:
                  memory: '128Mi'
            frrStatus:
              resources:
                requests:
                  cpu: '10m'
                  memory: '32Mi'
                limits:
                  memory: '128Mi'
  - path: k8s-rancher/apps/metallb
    repoURL: 'https://github.com/renklus/home-network'
    targetRevision: HEAD
  project: rancher-cluster
  destination:
    namespace: metallb-system
    name: in-cluster
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true