# k3s' Traefik serves Prometheus metrics on its 'metrics' port (9100). The monitor lives here and not in
# k8s-rancher/apps/traefik.yaml: app-of-apps dry-runs all its top-level files before prometheus-operator-crds (wave -1)
# has created the CRD, so on a fresh cluster the whole app-of-apps sync would fail. Not through the HelmChartConfig either:
# there, a missing CRD would fail k3s' whole Traefik install.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: traefik
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/instance: traefik-kube-system
  podMetricsEndpoints:
    - port: metrics
