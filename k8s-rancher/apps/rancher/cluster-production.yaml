apiVersion: provisioning.cattle.io/v1
kind: Cluster
metadata:
  name: production
  labels:
    #  key: string
  namespace: fleet-default
  annotations:
    ui.rancher/badge-icon-text: PRD
    # SkipDryRunOnMissingResource: the CRD is created by Rancher at runtime, and Argo CD dry-runs all waves before the first one starts, so a sync-wave wouldn't help.
    # Prune/Delete=false: removing this file or the rancher app does not make Rancher deprovision the cluster.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false,Delete=false
spec:
  kubernetesVersion: 'v1.37.1+k3s1'
  clusterAgentDeploymentCustomization:
    overrideResourceRequirements:
      requests:
        cpu: '50m'
        memory: '512Mi'
      limits:
        memory: '1Gi'
  fleetAgentDeploymentCustomization:
    overrideResourceRequirements:
      requests:
        cpu: '10m'
        memory: '128Mi'
      limits:
        memory: '512Mi'
  rkeConfig:
    machineGlobalConfig:
      disable:
        - servicelb
        - local-storage
      etcd-expose-metrics: true
      disable-etcd: false
      tls-san:
        - k8s02d.dev.renklus.ch
        - prod.k8s.renklus.ch
    # Delivered to every node; k3s loads kubelet config drop-ins from kubelet.conf.d (settings like shutdownGracePeriod have no kubelet flag).
    machineSelectorFiles:
      - fileSources:
          - configMap:
              name: production-kubelet-config
              items:
                - key: graceful-shutdown.conf
                  path: /var/lib/rancher/k3s/agent/etc/kubelet.conf.d/50-graceful-shutdown.conf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: production-kubelet-config
  namespace: fleet-default
  annotations:
    rke.cattle.io/object-authorized-for-clusters: production # Rancher only hands this to the listed clusters' machineSelectorFiles
data:
  # Graceful node shutdown: the kubelet stops pods before the network goes down, so writes to hard NFS mounts can't hang the shutdown.
  # 210s for regular pods covers CNPG's default 180s smart shutdown; the Proxmox VM shutdown timeout must exceed the total (use 300s).
  graceful-shutdown.conf: |
    apiVersion: kubelet.config.k8s.io/v1beta1
    kind: KubeletConfiguration
    shutdownGracePeriod: 240s
    shutdownGracePeriodCriticalPods: 30s