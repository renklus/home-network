apiVersion: provisioning.cattle.io/v1
kind: Cluster
metadata:
  name: production
  labels:
    #  key: string
  namespace: fleet-default
  annotations:
    ui.rancher/badge-icon-text: PRD
    # SkipDryRunOnMissingResource: the CRD is created by Rancher at runtime, and Argo CD dry-runs all waves before the first one starts, so a sync-wave wouldn't help.
    # Prune/Delete=false: removing this file or the rancher app does not make Rancher deprovision the cluster.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false,Delete=false
spec:
  kubernetesVersion: 'v1.37.1+k3s1'
  rkeConfig:
    machineGlobalConfig:
      disable:
        - servicelb
        - local-storage
      etcd-expose-metrics: true
      disable-etcd: false
      tls-san:
        - k8s02d.dev.renklus.ch
        - prod.k8s.renklus.ch
