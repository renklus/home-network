# The local cluster is imported (Rancher runs on it), not provisioned by Rancher.
# Use management.cattle.io/v3 instead of provisioning.cattle.io/v1 for imported k3s clusters;
apiVersion: management.cattle.io/v3
kind: Cluster
metadata:
  name: local
  annotations:
  # Prune/Delete=false: removing this file or the app does not delete the local cluster
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false,Delete=false
spec:
  k3sConfig:
    # update takes ~5 minutes and only works if rancher has support for this version
    kubernetesVersion: 'v1.37.1+k3s1'