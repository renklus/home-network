apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    # after haproxy (wave 0) is healthy. Requires the Application health check in argocd.yaml (resource.customizations.health.argoproj.io_Application), otherwise it wouldn't wait.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io # might benefit from background delete: https://github.com/argoproj/argo-cd/issues/5724#issuecomment-1041586611
spec:
  sources:
  - repoURL: quay.io/jetstack/charts
    chart: cert-manager
    targetRevision: 'v1.21.2'
    helm:
      parameters:
        - name: 'crds.enabled'
          value: 'true'
        # HTTP-01 self check goes through HAProxy. Cluster internal traffic and HTTPS traffic are not affected
        - name: 'http_proxy'
          value: 'http://haproxy.haproxy.svc.cluster.local:8000'
        - name: 'no_proxy'
          value: '127.0.0.1\,localhost\,.svc\,.cluster.local'
        # no need to specify image tags because the default is same as chart version. Dependabot can just update the chart
  - path: k8s-rancher/apps/cert-manager
    repoURL: 'https://github.com/renklus/home-network'
    targetRevision: HEAD
  project: rancher-cluster
  destination:
    namespace: cert-manager # has to be exactly this namespace for rancher to find it
    name: in-cluster
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false # 'false' as an attempt to get cert-manager out of endless sync - looks good for now
      - ServerSideApply=true