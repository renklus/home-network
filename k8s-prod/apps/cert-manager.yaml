# HTTP-01 challenges reach this cluster through HAProxy in the rancher cluster (k8s-rancher/apps/haproxy.yaml),
# which routes every host under .prod.k8s.renklus.ch to the prod traefik.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  sources:
  - repoURL: quay.io/jetstack/charts
    chart: cert-manager
    targetRevision: 'v1.21.2'
    helm:
      parameters:
        - name: 'crds.enabled'
          value: 'true'
        # HTTP-01 self check goes through HAProxy in the rancher cluster, like the real validation. Cluster internal traffic and HTTPS traffic are not affected
        - name: 'http_proxy'
          value: 'http://haproxy.haproxy.rancher.k8s.renklus.ch:8000'
        - name: 'no_proxy'
          value: '127.0.0.1\,localhost\,.svc\,.cluster.local'
        # no need to specify image tags because the default is same as chart version. Dependabot can just update the chart
  - path: k8s-prod/apps/cert-manager
    repoURL: 'https://github.com/renklus/home-network'
    targetRevision: HEAD
  project: prod-cluster
  destination:
    namespace: cert-manager
    name: production
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
