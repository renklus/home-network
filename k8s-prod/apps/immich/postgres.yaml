# Based on https://github.com/immich-app/immich-charts/blob/main/local/cloudnative-pg.yaml, but with the
# tensorchord/cloudnative-vectorchord image recommended by the chart README instead of an image volume extension.
# CNPG creates the database 'app' owned by user 'app' and stores the credentials in Secret 'immich-database-app'.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
  namespace: immich
spec:
  instances: 1

  storage:
    storageClass: truenas-nfs-no-backup
    size: '10Gi'
  # Tag is '<postgres>-<vectorchord>'.
  imageName: 'ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1@sha256:c7672bc011351a587cc292a94aac7eeebb593ed2e120077bd9c9944c9467db93'

  # Memory request equals the limit, as CNPG recommends, so the database is the last to be evicted under memory pressure.
  resources:
    requests:
      cpu: '100m'
      memory: '1Gi'
    limits:
      memory: '1Gi'

  postgresql:
    shared_preload_libraries:
      - 'vchord.so'

  managed:
    roles:
      # Immich's default setup: as superuser, Immich creates and updates its extensions (vchord, earthdistance)
      # and reindexes after VectorChord updates itself, and its built-in database backup (pg_dumpall) works.
      # https://docs.immich.app/administration/postgres-standalone/
      - name: app
        ensure: present
        login: true # defaults to false, which would lock Immich out
        superuser: true
        passwordSecret:
          name: immich-database-app
