# Based on https://github.com/immich-app/immich-charts/blob/main/local/cloudnative-pg.yaml, but with the
# tensorchord/cloudnative-vectorchord image recommended by the chart README instead of an image volume extension.
# CNPG creates the database 'app' owned by user 'app' and stores the credentials in Secret 'immich-database-app'.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
  namespace: immich
  annotations:
    # Keep the database when the immich app is deleted: CNPG would delete its PVC through owner references.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  # 3+ instances for quorum during reboot of 1 replica. Replicas let node drains (kured) proceed: CNPG switches the primary over to a replica
  # before the old primary is evicted, and with one node down there is still a replica to confirm synchronous commits.
  instances: 3
  affinity:
    # CNPG's default is 'preferred', which can leave two instances on one node after a reboot; draining it would then take both down
    podAntiAffinityType: required

  storage:
    storageClass: truenas-nfs-no-backup
    size: '10Gi'
  # fsGroupChangePolicy: 'OnRootMismatch' is done to skip kubelet's recursive chown/chmod of the NFS volume on every pod start, which slows down failovers and node drains.
  # Setting podSecurityContext replaces CNPG's default, which only re-adds runAsUser, runAsGroup and seccompProfile,
  # so fsGroup (26 = postgres) and runAsNonRoot must be set explicitly.
  podSecurityContext:
    # fsGroup: 26
    # runAsNonRoot: true
    fsGroupChangePolicy: 'OnRootMismatch'
  # Tag is '<postgres>-<vectorchord>'.
  imageName: 'ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1@sha256:c7672bc011351a587cc292a94aac7eeebb593ed2e120077bd9c9944c9467db93'

  # Memory request equals the limit, as CNPG recommends, so the database is the last to be evicted under memory pressure.
  # Immich requires at least 2GB for Postgres: https://docs.immich.app/install/requirements
  resources:
    requests:
      cpu: '100m'
      memory: '2Gi'
    limits:
      memory: '2Gi'

  postgresql:
    shared_preload_libraries:
      - 'vchord.so'
    # A commit returns only once a replica has it too, so a failover loses no committed data.
    # 'required' never falls back to asynchronous; writes block only if both replicas are down at the same time.
    # https://cloudnative-pg.io/documentation/current/replication/#data-durability-and-synchronous-replication
    synchronous:
      method: any
      number: 1
      dataDurability: required # required is default

  managed:
    roles:
      # Immich's default setup: as superuser, Immich creates and updates its extensions (vchord, earthdistance)
      # and reindexes after VectorChord updates itself, and its built-in database backup (pg_dumpall) works.
      # https://docs.immich.app/administration/postgres-standalone/
      - name: app
        ensure: present
        login: true # defaults to false, which would lock Immich out
        superuser: true
        passwordSecret:
          name: immich-database-app
