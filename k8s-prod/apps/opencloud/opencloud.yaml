# Plain manifests: the community chart (opencloud-eu/helm) was archived in 2025, production charts are enterprise-only.
# Single process with embedded IdP, user directory, NATS and search index; no database. Environment variables as in
# the upstream compose setup: https://github.com/opencloud-eu/opencloud-compose
#
# Requires extended attribute support on the storage (NFS 4.2 against TrueNAS SCALE); OpenCloud refuses to start without.
#
# The initial admin password is kept out of git, created by hand before the first sync:
# kubectl -n opencloud create secret generic opencloud-admin --from-literal=password='<initial admin password>'
# It is only used while no configuration exists, i.e. on the first start. Log in as 'admin'.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
  namespace: opencloud
spec:
  replicas: 1
  strategy:
    type: Recreate # embedded NATS, user directory and search index on one volume; never run two instances
  selector:
    matchLabels:
      app: opencloud
  template:
    metadata:
      labels:
        app: opencloud
    spec:
      # 3003 is the shared k8s user that owns app data on TrueNAS (docs/paperless-scanner-smb.md).
      securityContext:
        runAsUser: 3003
        runAsGroup: 3003
        fsGroup: 3003
        fsGroupChangePolicy: OnRootMismatch # don't walk all files on every start
      initContainers:
        # Writes opencloud.yaml with the internal secrets (JWT, service users, ...) on the first start only, so they
        # stay out of git and are backed up together with the data.
        - name: init
          image: docker.io/opencloudeu/opencloud:7.2.4@sha256:6d992ccc5f1cbc7b2a9b272ba25f879b1b159c2d7ed7f5527e09059f16295697
          command: ['sh', '-c', 'test -f "$OC_CONFIG_DIR/opencloud.yaml" || opencloud init']
          env:
            - name: OC_CONFIG_DIR
              value: '/var/lib/opencloud/config'
            - name: OC_INSECURE
              value: 'false' # without a value, init prompts and waits for input forever
            - name: IDM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencloud-admin
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/opencloud
      containers:
        - name: opencloud
          image: docker.io/opencloudeu/opencloud:7.2.4@sha256:6d992ccc5f1cbc7b2a9b272ba25f879b1b159c2d7ed7f5527e09059f16295697
          command: ['opencloud', 'server']
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: OC_URL
              value: 'https://opencloud.ingress.prod.k8s.renklus.ch'
            # Config in the data volume instead of /etc/opencloud: one volume, backed up as one consistent snapshot.
            - name: OC_CONFIG_DIR
              value: '/var/lib/opencloud/config'
            - name: PROXY_HTTP_ADDR
              value: '0.0.0.0:9200'
            - name: PROXY_TLS
              value: 'false' # TLS ends at Traefik
            # Certificates are verified, also for OIDC discovery against OC_URL, which resolves to Traefik in the cluster.
            - name: OC_INSECURE
              value: 'false'
            - name: IDM_CREATE_DEMO_USERS
              value: 'false'
            - name: OC_DEFAULT_LANGUAGE
              value: 'de'
            - name: FRONTEND_CHECK_FOR_UPDATES
              value: 'false' # Renovate updates the image
          volumeMounts:
            - name: data
              mountPath: /var/lib/opencloud
          resources:
            requests:
              cpu: '250m'
              memory: '512Mi'
            limits:
              memory: '2Gi'
          startupProbe:
            httpGet:
              path: /status.php
              port: http
            failureThreshold: 60 # data migrations run before the proxy answers, e.g. on major upgrades
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opencloud-data
---
# Files, metadata, configuration (config/), user directory and search index.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencloud-data
  namespace: opencloud
  annotations:
    # Keep the PVC when the opencloud app is removed.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-nfs
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opencloud
  namespace: opencloud
spec:
  selector:
    app: opencloud
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencloud
  namespace: opencloud
  annotations:
    cert-manager.io/cluster-issuer: 'letsencrypt-shortlived'
spec:
  ingressClassName: traefik
  rules:
    - host: opencloud.ingress.prod.k8s.renklus.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opencloud
                port:
                  name: http
  tls:
    - hosts:
        - opencloud.ingress.prod.k8s.renklus.ch
      secretName: opencloud-tls
