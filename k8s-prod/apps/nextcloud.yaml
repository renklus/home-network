# The 'nextcloud' namespace, its PVCs and the CNPG Cluster (nextcloud/) have 'Prune=false,Delete=false',
# so deleting this Application keeps the files and the database. The finalizer below deletes everything else.
# Only reachable from the LAN/VPN, like the other prod ingresses.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
  annotations:
    # after the CNPG operator (postgres-cnpg.yaml, wave 1), whose CRDs the database Cluster needs
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  sources:
  - repoURL: 'https://nextcloud.github.io/helm/'
    chart: 'nextcloud'
    targetRevision: '9.4.1'
    helm:
      parameters:
        - name: 'nextcloud.host'
          value: 'nextcloud.ingress.prod.k8s.renklus.ch'
        # Admin login for the first install only, kept out of git, created by hand:
        # kubectl -n nextcloud create secret generic nextcloud-admin --from-literal=nextcloud-username=admin --from-literal=nextcloud-password="$(openssl rand -base64 24)"
        - name: 'nextcloud.existingSecret.enabled'
          value: 'true'
        - name: 'nextcloud.existingSecret.secretName'
          value: 'nextcloud-admin'
        # Database from nextcloud/postgres.yaml; the keys are those of the Secret CNPG generates
        - name: 'internalDatabase.enabled'
          value: 'false'
        - name: 'externalDatabase.enabled'
          value: 'true'
        - name: 'externalDatabase.type'
          value: 'postgresql'
        - name: 'externalDatabase.existingSecret.enabled'
          value: 'true'
        - name: 'externalDatabase.existingSecret.secretName'
          value: 'nextcloud-database-app'
        - name: 'externalDatabase.existingSecret.usernameKey'
          value: 'username'
        - name: 'externalDatabase.existingSecret.passwordKey'
          value: 'password'
        - name: 'externalDatabase.existingSecret.hostKey'
          value: 'host'
        - name: 'externalDatabase.existingSecret.databaseKey'
          value: 'dbname'
        # nextcloud/redis.yaml
        - name: 'externalRedis.enabled'
          value: 'true'
        - name: 'externalRedis.host'
          value: 'nextcloud-redis'
        # Background jobs every 5 minutes, as a sidecar in the Nextcloud pod
        - name: 'cronjob.enabled'
          value: 'true'
        # PVCs from nextcloud/pvcs.yaml
        - name: 'persistence.enabled'
          value: 'true'
        - name: 'persistence.existingClaim'
          value: 'nextcloud-html'
        - name: 'persistence.nextcloudData.enabled'
          value: 'true'
        - name: 'persistence.nextcloudData.existingClaim'
          value: 'nextcloud-data'
        # The image's entrypoint runs installs and upgrades before Apache starts.
        # The chart's default 'Recreate' strategy stays, so two pods never upgrade at the same time.
        - name: 'startupProbe.enabled'
          value: 'true'
        - name: 'startupProbe.failureThreshold'
          value: '180'
        - name: 'ingress.enabled'
          value: 'true'
        - name: 'ingress.className'
          value: 'traefik'
      valuesObject:
        image:
          repository: 'library/nextcloud'
          tag: '35.0.2-apache@sha256:e0b1a2af52c82c07b7a0e8e59878bd8769e704447734d5d238a836982f51b9c8'
        resources:
          requests:
            cpu: '100m'
            memory: '512Mi'
          limits:
            memory: '2Gi'
        nextcloud:
          # The chart's default fsGroup (www-data), plus OnRootMismatch so kubelet doesn't walk all files on every start
          podSecurityContext:
            fsGroup: 33
            fsGroupChangePolicy: 'OnRootMismatch'
          configs:
            proxy.config.php: |-
              <?php
              $CONFIG = array (
                // Traefik runs in the k3s pod network; trust its X-Forwarded-* headers for the client IP
                'trusted_proxies' => array('10.42.0.0/16'),
                // TLS ends at Traefik, so generated links must still use https
                'overwriteprotocol' => 'https',
                // URL for links generated by occ and background jobs
                'overwrite.cli.url' => 'https://nextcloud.ingress.prod.k8s.renklus.ch',
                // phone numbers without a country code are Swiss
                'default_phone_region' => 'CH',
                // heavy background jobs start at this hour (UTC), after the nightly database dump
                'maintenance_window_start' => 1,
              );
        ingress:
          annotations:
            cert-manager.io/cluster-issuer: 'letsencrypt-shortlived'
          tls:
            - hosts:
                - 'nextcloud.ingress.prod.k8s.renklus.ch'
              secretName: 'nextcloud-tls'
  - path: k8s-prod/apps/nextcloud
    repoURL: 'https://github.com/renklus/home-network'
    targetRevision: HEAD
  project: prod-cluster
  destination:
    namespace: nextcloud
    name: production
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
