kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: truenas-nfs-soft #only to be used when IO errors are confirmed to not corrupt data for the consuming workload
  # no namespace, because cluster-scoped
provisioner: nfs.csi.k8s.io
parameters:
  server: 'app03l.dev.renklus.ch'
  share: '/mnt/hdd/general/k8s-prod'
  subdir: '${pvc.metadata.namespace}--${pvc.metadata.name}'
  # csi.storage.k8s.io/provisioner-secret is only needed for providing mountOptions in DeleteVolume
  # csi.storage.k8s.io/provisioner-secret-name: "mount-options"
  # csi.storage.k8s.io/provisioner-secret-namespace: "default"
reclaimPolicy: 'Retain'
volumeBindingMode: 'Immediate'
allowVolumeExpansion: true
mountOptions:
  - soft # on server outage, I/O fails with EIO after timeo×retrans; pods don't hang, but writes can be lost or corrupted
  - noatime
  - nfsvers=4.2
---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: truenas-nfs
  # no namespace, because cluster-scoped
provisioner: nfs.csi.k8s.io
parameters:
  server: 'app03l.dev.renklus.ch'
  share: '/mnt/hdd/general/k8s-prod'
  subdir: '${pvc.metadata.namespace}--${pvc.metadata.name}'
  # csi.storage.k8s.io/provisioner-secret is only needed for providing mountOptions in DeleteVolume
  # csi.storage.k8s.io/provisioner-secret-name: "mount-options"
  # csi.storage.k8s.io/provisioner-secret-namespace: "default"
reclaimPolicy: 'Retain'
volumeBindingMode: 'Immediate'
allowVolumeExpansion: true
mountOptions:
  - hard # on server outage, I/O blocks until the server returns, then resumes; no data loss, but pods can hang
  - noatime
  - nfsvers=4.2
---
