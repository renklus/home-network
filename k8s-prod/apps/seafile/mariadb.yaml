# Seafile supports only MySQL/MariaDB, so this uses mariadb-operator (mariadb-operator.yaml) instead of CNPG.
# Seafile connects through the 'seafile-database-primary' Service, which the operator points at the current primary.
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: seafile-database
  namespace: seafile
  annotations:
    # Keep the database when the seafile app is deleted.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  # Galera (the operator's production-ready HA mode) with 3 nodes keeps quorum while kured drains one of them.
  replicas: 3
  galera:
    enabled: true
  affinity:
    antiAffinityEnabled: true # one node per Kubernetes node, so a drain only takes one down
  podDisruptionBudget:
    maxUnavailable: 1
  # Generated by the operator if missing; Seafile itself never uses root (USE_EXISTING_DB in seafile.yaml).
  rootPasswordSecretKeyRef:
    name: seafile-database-root
    key: password
    generate: true

  storage:
    storageClassName: truenas-nfs-no-backup # backed up through the nightly dump below instead
    size: '5Gi'
  image: 'docker.io/library/mariadb:11.8.9@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd'
  timeZone: 'Europe/Zurich'

  # Memory request equals the limit so the database is the last to be evicted under memory pressure.
  resources:
    requests:
      cpu: '50m'
      memory: '1Gi'
    limits:
      memory: '1Gi'
---
# Seafile's own setup creates databases with this character set too (setup-seafile-mysql.py).
# cleanupPolicy Skip: deleting one of these resources never drops the database, user or grant.
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: ccnet-db
  namespace: seafile
spec:
  mariaDbRef:
    name: seafile-database
  name: ccnet_db
  characterSet: utf8
  collate: utf8_general_ci
  cleanupPolicy: Skip
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: seafile-db
  namespace: seafile
spec:
  mariaDbRef:
    name: seafile-database
  name: seafile_db
  characterSet: utf8
  collate: utf8_general_ci
  cleanupPolicy: Skip
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: seahub-db
  namespace: seafile
spec:
  mariaDbRef:
    name: seafile-database
  name: seahub_db
  characterSet: utf8
  collate: utf8_general_ci
  cleanupPolicy: Skip
---
# The password is the SEAFILE_MYSQL_DB_PASSWORD key of the hand-made 'seafile-secret' (seafile.yaml).
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: seafile
  namespace: seafile
spec:
  mariaDbRef:
    name: seafile-database
  host: '%'
  passwordSecretKeyRef:
    name: seafile-secret
    key: SEAFILE_MYSQL_DB_PASSWORD
  # The operator's default of 10 is less than Seafile's connection pools use (seaf-server alone allows 100).
  # 0 means no per-user limit; the server's max_connections still applies.
  maxUserConnections: 0
  cleanupPolicy: Skip
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: seafile-ccnet-db
  namespace: seafile
spec:
  mariaDbRef:
    name: seafile-database
  username: seafile
  host: '%'
  database: ccnet_db
  table: '*'
  privileges:
    - 'ALL PRIVILEGES'
  cleanupPolicy: Skip
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: seafile-seafile-db
  namespace: seafile
spec:
  mariaDbRef:
    name: seafile-database
  username: seafile
  host: '%'
  database: seafile_db
  table: '*'
  privileges:
    - 'ALL PRIVILEGES'
  cleanupPolicy: Skip
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: seafile-seahub-db
  namespace: seafile
spec:
  mariaDbRef:
    name: seafile-database
  username: seafile
  host: '%'
  database: seahub_db
  table: '*'
  privileges:
    - 'ALL PRIVILEGES'
  cleanupPolicy: Skip
---
# Nightly mariadb-dump of the three databases to the backed-up PVC below
# (TrueNAS: /mnt/hdd/general/k8s-prod/seafile--seafile-database-backup). Seafile's backup guide dumps the
# databases before copying the data directory, so the TrueNAS snapshot and rsync must run after this.
# Restore: a 'Restore' resource with 'backupRef: {name: seafile-database}' and 'database: <name>'.
# https://github.com/mariadb-operator/mariadb-operator/blob/main/docs/logical_backup.md
apiVersion: k8s.mariadb.com/v1alpha1
kind: Backup
metadata:
  name: seafile-database
  namespace: seafile
spec:
  mariaDbRef:
    name: seafile-database
  schedule:
    cron: '0 1 * * *'
  timeZone: 'Europe/Zurich'
  databases:
    - ccnet_db
    - seafile_db
    - seahub_db
  compression: gzip
  storage:
    volume:
      persistentVolumeClaim:
        claimName: seafile-database-backup
---
# Declared here instead of in the Backup, which would own the claim and delete it along with the Backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seafile-database-backup
  namespace: seafile
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-nfs
  resources:
    requests:
      storage: 5Gi
