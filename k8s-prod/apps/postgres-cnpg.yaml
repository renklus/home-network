apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  annotations:
    # CNPG CRDs and webhook must be ready before apps that contain a CNPG Cluster sync
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    # No cascading delete: removing the CRDs would delete every CNPG Cluster and, through owner references, its PVCs and data.
spec:
  sources:
  - repoURL: 'https://cloudnative-pg.github.io/charts'
    chart: 'cloudnative-pg'
    targetRevision: '0.29.1'
  - path: k8s-prod/apps/postgres-cnpg
    repoURL: 'https://github.com/renklus/home-network'
    targetRevision: HEAD
  project: prod-cluster
  destination:
    namespace: cnpg-system
    name: production
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true