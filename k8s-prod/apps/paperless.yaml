# The 'paperless' namespace (paperless/namespaces.yaml) and the CNPG Cluster (paperless/postgres.yaml) have
# 'Prune=false,Delete=false', so deleting this Application keeps the database. The finalizer below deletes everything
# else, including the document PVCs: their storage classes (csi-nfs/storage-classes.yaml) use reclaimPolicy 'Retain'
# and a per-PVC subdir, so the documents stay on TrueNAS and recreated PVCs find them again.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless
  namespace: argocd
  annotations:
    # after the CNPG operator (postgres-cnpg.yaml, wave 1), whose CRDs the database Cluster needs
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  sources:
  - path: k8s-prod/apps/paperless
    repoURL: 'https://github.com/renklus/home-network'
    targetRevision: HEAD
  project: prod-cluster
  destination:
    namespace: paperless
    name: production
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
