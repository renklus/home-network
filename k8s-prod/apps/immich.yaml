# WARNING: deleting this Application deletes all photos and the database.
# The finalizer below cascades to the 'immich' namespace (immich/namespaces.yaml). Deleting the namespace
# deletes every PVC in it, including 'immich-media' from the no-auto-delete app and the CNPG database PVC.
# Both use storage class 'truenas-nfs-hard' with reclaimPolicy 'Delete', so csi-driver-nfs then removes
# the subdirectory on the NFS share. Removing namespaces.yaml from git has the same effect through prune.
# TODO: use a storage class with reclaimPolicy 'Retain' and mark the namespace and PVCs with
# 'argocd.argoproj.io/sync-options: Prune=false,Delete=false'.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  sources:
  - repoURL: 'ghcr.io/immich-app/immich-charts'
    chart: 'immich'
    targetRevision: '0.13.1'
    helm:
      parameters:
        # - name: 'controllers.main.containers.main.env.REDIS_HOSTNAME'
        #   value: ''
        # - name: 'controllers.main.containers.main.env.IMMICH_MACHINE_LEARNING_URL'
        #   value: ''
        - name: 'immich.persistence.library.existingClaim'
          value: 'immich-media'
        - name: 'valkey.enabled'
          value: 'true'
        - name: 'valkey.persistence.data.type'
          value: 'persistentVolumeClaim'
        - name: 'valkey.persistence.data.storageClass'
          value: 'truenas-nfs-hard'
        - name: 'server.ingress.main.enabled'
          value: 'true'
        # - name: 'server.ingress.main.hosts'
        #   value: ''
        - name: 'machine-learning.persistence.cache.type'
          value: 'persistentVolumeClaim'
        - name: 'machine-learning.persistence.cache.storageClass'
          value: 'truenas-nfs-hard'
      valuesObject:
        # controllers:
        #   main:
        #     containers:
        #       main:
        #         image:
        #           repository: '_______________________________________quay.io/metallb/speaker'
        #           tag: 'v2.0.0'
        immich:
          configuration: {} # immich-config.json converted to yaml (https://immich.app/docs/install/config-file/)
        valkey:
          controllers:
            main:
              containers:
                main:
                  image:
                    repository: 'docker.io/valkey/valkey'
                    tag: '9.1-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328'
        server:
          controllers:
            main:
              containers:
                main:
                  image:
                    repository: 'ghcr.io/immich-app/immich-server'
                    tag: 'v2.7.5@sha256:c15bff75068effb03f4355997d03dc7e0fc58720c2b54ad6f7f10d1bc57efaa5'
        machineLearning:
          controllers:
            main:
              containers:
                main:
                  image:
                    repository: 'ghcr.io/immich-app/immich-machine-learning'
                    tag: 'v2.7.5@sha256:a2501141440f10516d329fdfba2c68082e19eb9ba6016c061ac80d23beadf7f3'
  - path: k8s-prod/apps/immich
    repoURL: 'https://github.com/renklus/home-network'
    targetRevision: HEAD
  project: prod-cluster
  destination:
    namespace: immich
    name: prod
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true