# The 'immich' namespace and the CNPG Cluster (immich/) have 'Prune=false,Delete=false', so deleting this Application
# keeps the database. The finalizer below deletes everything else, including the 'immich-media' PVC: its storage class
# (csi-nfs/storage-classes.yaml) uses reclaimPolicy 'Retain' and a per-PVC subdir, so the photos stay on TrueNAS and a
# recreated PVC finds them again.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  annotations:
    # after the CNPG operator (postgres-cnpg.yaml, wave 1), whose CRDs the database Cluster needs
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  sources:
  - repoURL: 'ghcr.io/immich-app/immich-charts'
    chart: 'immich'
    targetRevision: '0.13.4'
    helm:
      parameters:
        - name: 'immich.persistence.library.existingClaim'
          value: 'immich-media'
        - name: 'immich.metrics.enabled'
          value: 'true'
        - name: 'valkey.enabled'
          value: 'true'
        - name: 'valkey.persistence.data.type'
          value: 'persistentVolumeClaim'
        # Valkey only holds job queues, which Immich can rebuild: no backup needed.
        - name: 'valkey.persistence.data.storageClass'
          value: 'truenas-nfs-temp'
        - name: 'valkey.persistence.data.size'
          value: '5Gi'
        - name: 'valkey.persistence.data.accessMode'
          value: 'ReadWriteOnce'
        - name: 'machine-learning.persistence.cache.type'
          value: 'persistentVolumeClaim'
        - name: 'machine-learning.persistence.cache.storageClass'
          value: 'truenas-nfs-temp'
        - name: 'machine-learning.persistence.cache.size'
          value: '50Gi'
        - name: 'machine-learning.persistence.cache.accessMode'
          value: 'ReadWriteMany'
      valuesObject:
        immich:
          configuration: {} # immich-config.json converted to yaml (https://immich.app/docs/install/config-file/)
        valkey:
          controllers:
            main:
              containers:
                main:
                  image:
                    repository: 'docker.io/valkey/valkey'
                    # Use 3 part version number tag because the 2 part tag is not marked as pre release and would be used too early.
                    tag: '9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b'
                  # Valkey only holds Immich's job queues; the limit leaves headroom for bulk jobs over the whole library.
                  resources:
                    requests:
                      cpu: '50m'
                      memory: '64Mi'
                    limits:
                      memory: '512Mi'
        server:
          controllers:
            main:
              containers:
                main:
                  image:
                    repository: 'ghcr.io/immich-app/immich-server'
                    tag: 'v3.3.6@sha256:e1981983b1c13f6024b57d72e7ecae3342eed1581201ab09fb248932d86c593a'
                  resources:
                    requests:
                      cpu: '250m'
                      memory: '1Gi'
                    limits:
                      memory: '3Gi'
                  env:
                    # Secret generated by CNPG for the Cluster in immich/postgres.yaml
                    DB_URL:
                      valueFrom:
                        secretKeyRef:
                          name: 'immich-database-app'
                          key: 'uri'
          ingress:
            main:
              enabled: true
              className: 'traefik'
              annotations:
                cert-manager.io/cluster-issuer: 'letsencrypt-classic'
              hosts:
                - host: 'immich.ingress.prod.k8s.renklus.ch'
                  paths:
                    - path: '/'
                      service:
                        identifier: 'main'
              tls:
                - hosts:
                    - 'immich.ingress.prod.k8s.renklus.ch'
                  secretName: 'immich-tls'
        machine-learning:
          controllers:
            main:
              containers:
                main:
                  image:
                    repository: 'ghcr.io/immich-app/immich-machine-learning'
                    tag: 'v3.3.6@sha256:14367bfb374b8576ddf49abd67c5ca0190a4c7fcf6303cdad65d7f7bf1a50bc2'
                  # The default CLIP and facial recognition models need about 2-3Gi while loaded.
                  resources:
                    requests:
                      cpu: '250m'
                      memory: '2Gi'
                    limits:
                      memory: '3Gi'
                  env:
                    # temporary, introduced in v3.3.0
                    MACHINE_LEARNING_MODEL_REVISION: 'v2'
  - path: k8s-prod/apps/immich
    repoURL: 'https://github.com/renklus/home-network'
    targetRevision: HEAD
  project: prod-cluster
  destination:
    namespace: immich
    name: production
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true