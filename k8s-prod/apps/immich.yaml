# The 'immich' namespace (immich/namespaces.yaml) has 'Prune=false,Delete=false', so deleting this Application
# keeps the namespace and the PVCs in it, including 'immich-media' from the no-auto-delete app.
# The finalizer below still deletes resources this app owns, e.g. the CNPG Cluster (immich/postgres.yaml),
# whose PVC CNPG then deletes; its storage class uses reclaimPolicy 'Retain', so the data stays on the NFS share.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  annotations:
    # after the CNPG operator (postgres-cnpg.yaml, wave 1), whose CRDs the database Cluster needs
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  sources:
  - repoURL: 'ghcr.io/immich-app/immich-charts'
    chart: 'immich'
    targetRevision: '0.13.3'
    helm:
      parameters:
        - name: 'immich.persistence.library.existingClaim'
          value: 'immich-media'
        - name: 'valkey.enabled'
          value: 'true'
        - name: 'valkey.persistence.data.type'
          value: 'persistentVolumeClaim'
        - name: 'valkey.persistence.data.storageClass'
          value: 'truenas-nfs'
        - name: 'valkey.persistence.data.size'
          value: '5Gi'
        - name: 'valkey.persistence.data.accessMode'
          value: 'ReadWriteOnce'
        - name: 'machine-learning.persistence.cache.type'
          value: 'persistentVolumeClaim'
        - name: 'machine-learning.persistence.cache.storageClass'
          value: 'truenas-nfs-temp'
        - name: 'machine-learning.persistence.cache.size'
          value: '50Gi'
        - name: 'machine-learning.persistence.cache.accessMode'
          value: 'ReadWriteMany'
      valuesObject:
        immich:
          configuration: {} # immich-config.json converted to yaml (https://immich.app/docs/install/config-file/)
        valkey:
          controllers:
            main:
              containers:
                main:
                  image:
                    repository: 'docker.io/valkey/valkey'
                    # Use 3 part version number tag because the 2 part tag is not marked as pre release and would be used too early.
                    tag: '9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11'
                  # Resources for all containers: the prod node also runs etcd and k3s, and unbounded image processing made
                  # the whole cluster unresponsive. CPU and memory limits leave headroom for the system and other apps.
                  # Valkey only holds Immich's job queues; the limit leaves headroom for bulk jobs over the whole library.
                  resources:
                    requests:
                      cpu: '50m'
                      memory: '64Mi'
                    limits:
                      memory: '512Mi'
        server:
          controllers:
            main:
              containers:
                main:
                  image:
                    repository: 'ghcr.io/immich-app/immich-server'
                    tag: 'v3.2.4@sha256:d317916b28090c33eb36b308464ea391f8b7df1d850fcfea227a39ec879718c2'
                  resources:
                    requests:
                      cpu: '250m'
                      memory: '1Gi'
                    limits:
                      cpu: '3'
                      memory: '3Gi'
                  env:
                    # Secret generated by CNPG for the Cluster in immich/postgres.yaml
                    DB_URL:
                      valueFrom:
                        secretKeyRef:
                          name: 'immich-database-app'
                          key: 'uri'
          ingress:
            main:
              enabled: true
              className: 'traefik'
              annotations:
                cert-manager.io/cluster-issuer: 'letsencrypt-shortlived'
              hosts:
                - host: 'immich.ingress.prod.k8s.renklus.ch'
                  paths:
                    - path: '/'
                      service:
                        identifier: 'main'
              tls:
                - hosts:
                    - 'immich.ingress.prod.k8s.renklus.ch'
                  secretName: 'immich-tls'
        machine-learning:
          controllers:
            main:
              containers:
                main:
                  image:
                    repository: 'ghcr.io/immich-app/immich-machine-learning'
                    tag: 'v3.2.4@sha256:e16c2f166a8174901959fdf85e2e4c7bd1ebc4b37e0b6655de97c41408a260c4'
                  # The default CLIP and facial recognition models need about 2-3Gi while loaded.
                  resources:
                    requests:
                      cpu: '250m'
                      memory: '1Gi'
                    limits:
                      cpu: '2'
                      memory: '3Gi'
  - path: k8s-prod/apps/immich
    repoURL: 'https://github.com/renklus/home-network'
    targetRevision: HEAD
  project: prod-cluster
  destination:
    namespace: immich
    name: production
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true