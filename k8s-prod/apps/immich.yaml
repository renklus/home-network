# WARNING: deleting this Application deletes every PVC of Immich.
# The finalizer below cascades to the 'immich' namespace (immich/namespaces.yaml). Deleting the namespace
# deletes every PVC in it, including 'immich-media' from the no-auto-delete app and the CNPG database PVC.
# Their storage classes use reclaimPolicy 'Retain': the data stays on the NFS share and the PVs become 'Released';
# a recreated PVC with the same name provisions into the same subdirectory. Only the ML cache ('truenas-nfs-temp')
# is deleted. Removing namespaces.yaml from git has the same effect through prune.
# TODO: mark the namespace and PVCs with
# 'argocd.argoproj.io/sync-options: Prune=false,Delete=false'.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  annotations:
    # after the CNPG operator (postgres-cnpg.yaml, wave 1), whose CRDs the database Cluster needs
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  sources:
  - repoURL: 'ghcr.io/immich-app/immich-charts'
    chart: 'immich'
    targetRevision: '0.13.1'
    helm:
      parameters:
        - name: 'immich.persistence.library.existingClaim'
          value: 'immich-media'
        - name: 'valkey.enabled'
          value: 'true'
        - name: 'valkey.persistence.data.type'
          value: 'persistentVolumeClaim'
        - name: 'valkey.persistence.data.storageClass'
          value: 'truenas-nfs'
        - name: 'valkey.persistence.data.size'
          value: '5Gi'
        - name: 'valkey.persistence.data.accessMode'
          value: 'ReadWriteOnce'
        - name: 'machine-learning.persistence.cache.type'
          value: 'persistentVolumeClaim'
        - name: 'machine-learning.persistence.cache.storageClass'
          value: 'truenas-nfs-temp'
        - name: 'machine-learning.persistence.cache.size'
          value: '50Gi'
        - name: 'machine-learning.persistence.cache.accessMode'
          value: 'ReadWriteMany'
      valuesObject:
        immich:
          configuration: {} # immich-config.json converted to yaml (https://immich.app/docs/install/config-file/)
        valkey:
          controllers:
            main:
              containers:
                main:
                  image:
                    repository: 'docker.io/valkey/valkey'
                    # Use 3 part version number tag because the 2 part tag is not marked as pre release and would be used too early.
                    tag: '9.1.0-alpine@sha256:c9b77919daeba2c02ad954d0c844cc4e7142069d177b89c5fd771f405daf9e02'
        server:
          controllers:
            main:
              containers:
                main:
                  image:
                    repository: 'ghcr.io/immich-app/immich-server'
                    tag: 'v3.2.4@sha256:d317916b28090c33eb36b308464ea391f8b7df1d850fcfea227a39ec879718c2'
                  env:
                    # Secret generated by CNPG for the Cluster in immich/postgres.yaml
                    DB_URL:
                      valueFrom:
                        secretKeyRef:
                          name: 'immich-database-app'
                          key: 'uri'
          ingress:
            main:
              enabled: true
              className: 'traefik'
              annotations:
                cert-manager.io/cluster-issuer: 'letsencrypt-shortlived'
              hosts:
                - host: 'immich.ingress.prod.k8s.renklus.ch'
                  paths:
                    - path: '/'
                      service:
                        identifier: 'main'
              tls:
                - hosts:
                    - 'immich.ingress.prod.k8s.renklus.ch'
                  secretName: 'immich-tls'
        machine-learning:
          controllers:
            main:
              containers:
                main:
                  image:
                    repository: 'ghcr.io/immich-app/immich-machine-learning'
                    tag: 'v3.2.4@sha256:e16c2f166a8174901959fdf85e2e4c7bd1ebc4b37e0b6655de97c41408a260c4'
  - path: k8s-prod/apps/immich
    repoURL: 'https://github.com/renklus/home-network'
    targetRevision: HEAD
  project: prod-cluster
  destination:
    namespace: immich
    name: production
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true