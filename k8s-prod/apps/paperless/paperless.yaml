apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate # never run two instances (migrations, consumer) at once
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      # Rootless instead of USERMAP_UID/USERMAP_GID. 3003 is the UID of the legacy setup, which owns the copied export.
      securityContext:
        runAsUser: 3003
        runAsGroup: 3003
        fsGroup: 3003
        fsGroupChangePolicy: OnRootMismatch # don't walk all documents on every start
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:3.2.1@sha256:5fa76604a81df6945086e0837b14b56543d137e8ce4f311cc5d9ebe907e74e79
          ports:
            - name: http
              containerPort: 8000
            - name: flower
              containerPort: 5555
          envFrom:
            - configMapRef:
                name: paperless-env # generated from paperless.env (kustomization.yaml)
          env:
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-database-app
                  key: password
            # PAPERLESS_SECRET_KEY is kept out of git, created by hand:
            # kubectl -n paperless create secret generic paperless-secret-key \
            #   --from-literal=secret-key="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')"
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secret-key
                  key: secret-key
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
            # Only used for manual document_exporter/document_importer runs
            - name: export
              mountPath: /usr/src/paperless/export
          resources:
            requests:
              cpu: '100m'
              memory: '2Gi'
            limits:
              memory: '3Gi'
          startupProbe:
            httpGet:
              path: /
              port: 8000
            failureThreshold: 180 # database migrations run before the webserver starts, e.g. on major upgrades
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media
        - name: consume
          persistentVolumeClaim:
            claimName: paperless-consume
        - name: export
          persistentVolumeClaim:
            claimName: paperless-export
---
apiVersion: v1
kind: Service
metadata:
  name: paperless
  namespace: paperless
spec:
  selector:
    app: paperless
  ports: # comes from ingress, goes to container
    - name: http
      port: 8000
      targetPort: http
    - name: flower
      port: 5555
      targetPort: flower
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless
  namespace: paperless
  annotations:
    cert-manager.io/cluster-issuer: 'letsencrypt-shortlived'
spec:
  ingressClassName: traefik
  rules:
    - host: paperless.ingress.prod.k8s.renklus.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperless
                port:
                  name: http
  tls:
    - hosts:
        - paperless.ingress.prod.k8s.renklus.ch
      secretName: paperless-tls
