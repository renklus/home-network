# CNPG creates the database 'app' owned by user 'app' and stores the credentials in Secret 'paperless-database-app'.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-database
  namespace: paperless
  annotations:
    # Keep the database when the paperless app is deleted: CNPG would delete its PVC through owner references.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  # 3+ instances for quorum during reboot of 1 replica. Replicas let node drains (kured) proceed: CNPG switches the primary over to a replica
  # before the old primary is evicted, and with one node down there is still a replica to confirm synchronous commits.
  instances: 3
  # Shorten the time Paperless has no writable database from a full pod restart to a few seconds.
  primaryUpdateMethod: switchover
  affinity:
    # CNPG's default is 'preferred', which can leave two instances on one node after a reboot; draining it would then take both down
    podAntiAffinityType: required

  storage:
    storageClass: truenas-nfs-no-backup
    size: '5Gi'
  imageName: 'ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:26d15a12723510b0b416e8aec2bc65f2da7ac9b77ef3182a0911e4b8b991420a'

  # Memory request equals the limit, as CNPG recommends, so the database is the last to be evicted under memory pressure.
  resources:
    requests:
      cpu: '50m'
      memory: '512Mi'
    limits:
      memory: '512Mi'
---
# Metrics of the database instances, as CNPG recommends instead of the deprecated spec.monitoring.enablePodMonitor.
# Alert rules for all CNPG Clusters: postgres-cnpg/rules.yaml
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: paperless-database
  namespace: paperless
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: paperless-database
      cnpg.io/podRole: instance
  # becomes the label 'cnpg_io_cluster', used by the rules to compare instances of the same Cluster
  podTargetLabels:
    - cnpg.io/cluster
  podMetricsEndpoints:
    - port: metrics
