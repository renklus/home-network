# Nightly backup: pg_dump of the database (postgres.yaml) to the backed-up mealie-backup PVC
# (TrueNAS: /mnt/hdd/general/k8s-prod/mealie--mealie-backup), which the TrueNAS snapshot and rsync must run after.
# Images and uploads are on mealie-data, which is backed up directly.
# Restore: scale the Deployment to 0, then from a pod with this PVC and the same image
#   pg_restore --clean --if-exists --no-owner --dbname="$DATABASE_URI" /backup/mealie.dump
# TODO: consider Mealie's own backups (POST /api/admin/backups) instead. Before switching, solve: an admin API token as
# a hand-made Secret, pruning old zips (Mealie never deletes them, and each holds all images again), and restores only
# working into the same Mealie version.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mealie-backup
  namespace: mealie
spec:
  schedule: '0 1 * * *'
  timeZone: 'Europe/Zurich'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 26 # postgres
            runAsGroup: 26
            fsGroup: 26
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: backup
              # Same image as the database, so pg_dump matches the server's major version
              image: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318
              # Dump to a temporary file first, so a failed run never replaces the last good dump.
              command:
                - sh
                - -c
                - pg_dump --dbname="$DATABASE_URI" --format=custom --file=/backup/mealie.dump.tmp && mv /backup/mealie.dump.tmp /backup/mealie.dump
              env:
                - name: DATABASE_URI
                  valueFrom:
                    secretKeyRef:
                      name: mealie-database-app
                      key: uri
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: '50m'
                  memory: '64Mi'
                limits:
                  memory: '256Mi'
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: mealie-backup
