apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-test-redis
  namespace: paperless-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-test-redis
  template:
    metadata:
      labels:
        app: paperless-test-redis
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: '20m'
              memory: '32Mi'
            limits:
              memory: '256Mi'
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-test-redis
  namespace: paperless-test
spec:
  selector:
    app: paperless-test-redis
  ports:
    - name: redis
      port: 6379
