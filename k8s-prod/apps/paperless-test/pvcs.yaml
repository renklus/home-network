apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-test-media
  namespace: paperless-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-nfs-temp
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-test-data
  namespace: paperless-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-nfs-temp
  resources:
    requests:
      storage: 10Gi